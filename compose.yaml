services:
  mysql:
    image: mysql:8.4
    mem_limit: 1g
    environment:
      MYSQL_DATABASE: zhuatech_cleandesk
      MYSQL_USER: cleandesk
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --connect-timeout=5 -h127.0.0.1 -u"$$MYSQL_USER" -N -e "SELECT 1" "$$MYSQL_DATABASE"']
      interval: 5s
      timeout: 5s
      start_period: 40m
      retries: 60
    restart: unless-stopped
  backend:
    build: ./backend
    mem_limit: 1536m
    environment:
      DATABASE_URL: jdbc:mariadb://mysql:3306/zhuatech_cleandesk?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowLocalInfile=false&sslMode=trust
      DATABASE_USER: cleandesk
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health/readiness]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 60
    restart: unless-stopped
  frontend:
    build: ./frontend
    mem_limit: 128m
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8174}:8080']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/actuator/health/readiness]
      interval: 10s
      retries: 10
    restart: unless-stopped
volumes:
  mysql-data:
