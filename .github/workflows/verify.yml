name: CleanDesk verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cleandesk_test
          MYSQL_USER: cleandesk_test
          MYSQL_PASSWORD: CIonly9TestDatabase
          MYSQL_ROOT_PASSWORD: CIonly9RootDatabase
        ports: ['3306:3306']
        options: >-
          --health-cmd="MYSQL_PWD=CIonly9TestDatabase mysql -h127.0.0.1 -ucleandesk_test -N -e 'SELECT 1' cleandesk_test"
          --health-interval=5s --health-timeout=5s --health-retries=60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Source, documentation and original brand assets
        run: python3 scripts/release-check.py
      - name: H2 tests and application package
        working-directory: backend
        run: mvn -B spotless:check verify
      - name: Real MySQL tests and concurrent transactions
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:mariadb://127.0.0.1:3306/cleandesk_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowLocalInfile=false&sslMode=trust
          TEST_DATABASE_USER: cleandesk_test
          TEST_DATABASE_PASSWORD: CIonly9TestDatabase
          TEST_DIALECT: cn.zhuatech.cleandesk.MySqlJdbcDialect
        run: mvn -B test
      - name: Frontend checks and production build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Fresh deployment with tests enabled in image builds
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 scripts/init-env.py
          docker compose -p cleandesk-ci config --quiet
          docker compose -p cleandesk-ci up --build -d --wait --wait-timeout 600
          python3 scripts/readiness.py --base http://127.0.0.1:8174
          python3 scripts/quality.py --base http://127.0.0.1:8174 --isolated-test-database
      - name: Restart persistence and fresh-volume restore
        run: |
          docker compose -p cleandesk-ci restart backend frontend
          python3 scripts/readiness.py --base http://127.0.0.1:8174
          python3 scripts/verify-persistence.py --base http://127.0.0.1:8174 --state output/qa-state.json
          python3 scripts/backup.py --project cleandesk-ci --output output/ci-backup.zip
          python3 scripts/restore-env.py --source .env --output output/restore.env --port 8176
          python3 scripts/restore.py output/ci-backup.zip --project cleandesk-ci-restore --env-file output/restore.env
          python3 scripts/verify-persistence.py --base http://127.0.0.1:8176 --state output/qa-state.json
      - name: Remove only the disposable CI projects
        if: always()
        run: |
          if test -f output/restore.env; then docker compose --env-file output/restore.env -p cleandesk-ci-restore down -v --remove-orphans; fi
          if test -f .env; then docker compose -p cleandesk-ci down -v --remove-orphans; fi
