services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cleandesk_test
      MYSQL_USER: cleandesk_test
      MYSQL_PASSWORD: ${TEST_DATABASE_PASSWORD:?set TEST_DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${TEST_ROOT_PASSWORD:?set TEST_ROOT_PASSWORD}
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --connect-timeout=5 -h127.0.0.1 -u"$$MYSQL_USER" -N -e "SELECT 1" "$$MYSQL_DATABASE"']
      interval: 5s
      start_period: 20m
      retries: 60
  tests:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /work
    volumes: [./backend:/work, maven-cache:/root/.m2]
    environment:
      TEST_DATABASE_URL: jdbc:mariadb://mysql:3306/cleandesk_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowLocalInfile=false&sslMode=trust
      TEST_DATABASE_USER: cleandesk_test
      TEST_DATABASE_PASSWORD: ${TEST_DATABASE_PASSWORD:?set TEST_DATABASE_PASSWORD}
      TEST_DIALECT: cn.zhuatech.cleandesk.MySqlJdbcDialect
    depends_on:
      mysql: {condition: service_healthy}
    command: [mvn, -B, spotless:check, test]
volumes:
  maven-cache:
    external: true
    name: cleandesk-maven-cache
